[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awrun"
version = "0.1.1"
description = "A priority-aware queue and dispatcher for agentic runs and ad-hoc CI builds — real dynamic priority for the class of work we control, instead of GitHub Actions' opaque FIFO."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# awbac is a HARD import in authz.py (the comet-deploy money gate builds a
# Policy on every check); it is ours and on PyPI (0.1.0, Aitherium/awbac), so
# it is a real dependency, not an extra. sync-awrun's test job died on
# `ModuleNotFoundError: No module named 'awbac'` (2026-09-14) the first time
# the runner had pip at all. awrelay stays optional: dispatcher guards it.
# awdit likewise: authz.py appends and verifies the audit log through it
# (run 34797337018 died on ModuleNotFoundError: No module named 'awdit' the
# moment awbac was present). Ours, on PyPI (0.1.0, Aitherium/awdit).
dependencies = ["awbac>=0.1.0", "awdit>=0.1.0"]

[project.optional-dependencies]
# `--kind ci` dispatch shells out to `gh`, so it needs no extra Python dep beyond
# the CLI being on PATH. Declared here anyway so a missing `gh` fails with a
# clear message at submit time rather than a bare FileNotFoundError.
ci = []

dev = ["pytest>=7.0"]

[project.scripts]
awrun = "awrun.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awrun"
Documentation = "https://github.com/Aitherium/awrun#readme"
Repository = "https://github.com/Aitherium/awrun.git"
Issues = "https://github.com/Aitherium/awrun/issues"

[tool.setuptools]
packages = ["awrun"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
